plugins {
    alias(libs.plugins.android.application)
}

android {

    signingConfigs {
        release {
            storeFile file('../keystore/opluskeyhook.jks')
            storePassword 'opluskeyhook'
            keyAlias 'opluskeyhook'
            keyPassword 'opluskeyhook'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    namespace 'io.github.pingdongyi.rdpkeyhook'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.pingdongyi.rdpkeyhook"
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName "1.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
