plugins {
    alias(libs.plugins.android.application)
}

android {

    signingConfigs {
        release {
            storeFile file('../keystore/opluskeyhook.jks')
            storePassword 'opluskeyhook'
            keyAlias 'opluskeyhook'
            keyPassword 'opluskeyhook'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    namespace 'me.siowu.OplusKeyHook'
    compileSdk 35

    defaultConfig {
        applicationId "me.siowu.OplusKeyHook"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "1.6"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
